{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="app-form-wrapper" style="max-width:450px; margin:50px auto;">

    <div class="app-form-header">
        <h2><i class="bi bi-clipboard-data"></i> Check Result</h2>
        <span class="step-text">Enter your credentials</span>
    </div>

    <form method="post" class="app-form-body">
        {% csrf_token %}

        <div class="mb-3 input-icon">
            <i class="bi bi-file-text"></i>
            <input type="text" name="application_number" placeholder="Application Number" class="form-control">
        </div>

        <div class="mb-3 input-icon">
            <i class="bi bi-envelope"></i>
            <input type="email" name="email" placeholder="Email" class="form-control">
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-primary" onclick="playSound('{% static 'sounds/login.mp3' %}')">
                <i class="bi bi-search"></i> Check Result
            </button>
        </div>

        {% if error %}
        <p class="text-danger mt-2" style="text-align:center;">{{ error }}</p>
        {% endif %}
    </form>
</div>

<style>
/* ===== APP FORM WRAPPER ===== */
.app-form-wrapper {
    background:#fff;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    padding:25px;
    border:1px solid #ccc;
}

/* ===== HEADER ===== */
.app-form-header h2 {
    text-align:center;
    font-weight:bold;
    color:#007bff;
    margin-bottom:10px;
}
.app-form-header .step-text {
    display:block;
    text-align:center;
    font-size:13px;
    color:#555;
}

/* ===== INPUT ICON ===== */
.input-icon {
    position: relative;
}
.input-icon i {
    position:absolute;
    left:10px;
    top:50%;
    transform:translateY(-50%);
    color:#007bff;
    font-size:16px;
}
.input-icon input {
    padding-left:35px;
}

/* ===== BUTTON ===== */
.app-form-body .btn {
    width:100%;
    padding:10px 0;
    font-weight:bold;
    border-radius:8px;
    transition:0.3s all;
}
.app-form-body .btn:hover {
    background:#0056b3;
    color:#fff;
}
</style>

{% endblock %}
