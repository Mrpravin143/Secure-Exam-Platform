{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="container d-flex justify-content-center my-5">

    <div class="card shadow-sm" style="width:420px; border:1px solid #999;">

        <!-- Header -->
        <div class="card-header bg-light text-center py-3">
            <h6 class="fw-bold mb-0">
                <i class="bi bi-upload"></i>
                Upload & Declaration
            </h6>
            <small class="text-muted">Step 3 of 3</small>
        </div>

        <!-- Body -->
        <div class="card-body p-4">
            <form method="post"
                  enctype="multipart/form-data">
                {% csrf_token %}

                <!-- Profile Image -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold">
                        <i class="bi bi-person-bounding-box text-secondary"></i>
                        Upload Profile Photo
                    </label>
                    <input type="file"
                           name="profile_image"
                           class="form-control form-control-sm">
                    <small class="text-muted">
                        JPG / PNG only
                    </small>
                </div>

                <!-- Declaration -->
                <div class="form-check mb-4">
                    <input class="form-check-input"
                           type="checkbox"
                           name="declaration"
                           id="declarationCheck">
                    <label class="form-check-label small"
                           for="declarationCheck">
                        I confirm that the above details are correct
                    </label>
                </div>

                <!-- Submit -->
                <div class="text-center">
                    <button type="submit"
                            class="btn btn-secondary btn-sm px-4"
                            onclick="playSound('{% static 'sounds/submit_success.mp3' %}')">
                        Submit Application
                        <i class="bi bi-check-circle ms-1"></i>
                    </button>
                </div>

            </form>
        </div>

    </div>

</div>

{% endblock %}
